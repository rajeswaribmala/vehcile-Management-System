<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">
    <div class="title">ADMIN DASHBOARD</div>

    <h2>Mechanic Approvals</h2>

    {% for m in mechanics %}
        <p>
            {{ m[1] }} - {{ m[2] }}
            {% if m[2] != 'approved' %}
                <a href="/approve/{{ m[0] }}">Approve</a>
            {% endif %}
        </p>
    {% endfor %}

    <br>
    <a href="/logout">Logout</a>
</div>

</body>
</html>
