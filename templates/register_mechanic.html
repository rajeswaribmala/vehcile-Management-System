<!DOCTYPE html>
<html>
<head>
    <title>Mechanic Register</title>
    <style>
        
body{
    margin:0;
    font-family:Arial;
    background:url("/static/images/login2.webp") no-repeat center center/cover;
    background-attachment:fixed;
}

header{
    background:#0d6efd;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}
.card{
    width:350px;
    margin:120px auto;
    padding:30px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);

    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

input,select{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

button{
    background:#0d6efd;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#0d6efd;
}

.error-message{
    background:#ffdddd;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
    color:red;
}
    </style>
</head>
<body>

<div class="card">
   <center><h2>Mechanic Registration</h2></center>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input name="username" placeholder="Username" required>

        <input name="password" type="password" placeholder="Password" required>
        <label>Select Branch Location:</label>
        <select name="branch_id" required>
    <option value="">-- Select Branch --</option>
    {% for b in branches %}
        <option value="{{ b['id'] }}">
            {{ b['branch_name'] }} - {{ b['location'] }}
        </option>
    {% endfor %}
</select>
        <br><br>

        <center><button type="submit">Register</button></center>
    </form>

   <cneter><a href="/login">Back to Login</a></cneter>
</div>

</body>
</html>
